    <!-- ================= CLOUD SYNC REAL-TIME ENGINE ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.cloudSyncEngine = {
            enabled: false,
            db: null,
            user: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'default-app-id',
            isApplyingRemote: false
        };

        async function initCloudSync() {
            const badge = document.getElementById('cloudSyncBadge');
            const badgeText = document.getElementById('cloudSyncText');

            if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                if (badge) badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200 text-[11px] font-bold';
                if (badgeText) badgeText.textContent = 'Mode Lokal';
                return;
            }

            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    window.cloudSyncEngine.user = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    window.cloudSyncEngine.user = cred.user;
                }

                window.cloudSyncEngine.db = db;
                window.cloudSyncEngine.enabled = true;

                if (badge) badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold';
                if (badgeText) badgeText.textContent = 'Cloud Aktif (Real-Time)';

                // Dengarkan perubahan real-time dari PC/perangkat lain
                const colRef = collection(db, 'artifacts', window.cloudSyncEngine.appId, 'public', 'data', 'sim_surat_sync');
                onSnapshot(colRef, (snapshot) => {
                    if (!window.cloudSyncEngine.user) return;
                    if (snapshot.empty) {
                        // Unggah data awal jika cloud masih kosong
                        window.pushAllToCloud();
                        return;
                    }

                    window.cloudSyncEngine.isApplyingRemote = true;
                    let hasUpdates = false;

                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (!data || !data.payload) return;
                        try {
                            const parsed = JSON.parse(data.payload);
                            if (docSnap.id === 'schoolProfile' && parsed) {
                                schoolProfile = parsed;
                                hasUpdates = true;
                            } else if (docSnap.id === 'staffUsersList' && Array.isArray(parsed)) {
                                staffUsersList = parsed;
                                hasUpdates = true;
                            } else if (docSnap.id === 'suratMasukList' && Array.isArray(parsed)) {
                                suratMasukList = parsed;
                                hasUpdates = true;
                            } else if (docSnap.id === 'suratKeluarList' && Array.isArray(parsed)) {
                                suratKeluarList = parsed;
                                hasUpdates = true;
                            }
                        } catch (err) {
                            console.error('Parse cloud payload error:', err);
                        }
                    });

                    if (hasUpdates) {
                        if (typeof renderQuickLoginUsers === 'function') renderQuickLoginUsers();
                        if (currentUser && typeof initApp === 'function') {
                            initApp();
                        }
                    }
                    window.cloudSyncEngine.isApplyingRemote = false;
                }, (error) => {
                    console.error('Cloud snapshot error:', error);
                    if (badge) badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[11px] font-bold';
                    if (badgeText) badgeText.textContent = 'Sync Tertunda';
                });

            } catch (err) {
                console.error('Cloud init failed:', err);
                if (badge) badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 text-[11px] font-bold';
                if (badgeText) badgeText.textContent = 'Offline / Lokal';
            }
        }

        window.pushAllToCloud = async function() {
            const engine = window.cloudSyncEngine;
            if (!engine || !engine.enabled || !engine.db || !engine.user || engine.isApplyingRemote) return;

            const badgeText = document.getElementById('cloudSyncText');
            if (badgeText) badgeText.textContent = 'Menyimpan ke Cloud...';

            try {
                const timestamp = new Date().toISOString();
                const baseCol = ['artifacts', engine.appId, 'public', 'data', 'sim_surat_sync'];

                await Promise.all([
                    setDoc(doc(engine.db, ...baseCol, 'schoolProfile'), { payload: JSON.stringify(schoolProfile), updatedAt: timestamp }),
                    setDoc(doc(engine.db, ...baseCol, 'staffUsersList'), { payload: JSON.stringify(staffUsersList), updatedAt: timestamp }),
                    setDoc(doc(engine.db, ...baseCol, 'suratMasukList'), { payload: JSON.stringify(suratMasukList), updatedAt: timestamp }),
                    setDoc(doc(engine.db, ...baseCol, 'suratKeluarList'), { payload: JSON.stringify(suratKeluarList), updatedAt: timestamp })
                ]);

                if (badgeText) badgeText.textContent = 'Tersimpan di Cloud ✓';
                setTimeout(() => {
                    if (badgeText && engine.enabled) badgeText.textContent = 'Cloud Aktif (Real-Time)';
                }, 2000);
            } catch (err) {
                console.error('Gagal menyimpan ke cloud:', err);
                if (badgeText) badgeText.textContent = 'Gagal Sync Cloud';
            }
        };

        initCloudSync();
    </script>

### Pembaruan Sinkronisasi Otomatis Antar-Perangkat / PC:
1. **Sinkronisasi Cloud Real-Time**: Setiap kali data ditambahkan, diubah, atau dihapus pada salah satu PC maupun Handphone (baik **Surat Masuk**, **Surat Keluar**, **Profil Sekolah**, maupun **Data Staf/Admin**), sistem otomatis mengirimkan pembaruan ke penyimpanan cloud dan langsung menyegarkan tampilan di perangkat lain secara seketika tanpa perlu muat ulang halaman.
2. **Indikator Status Sinkronisasi di Bilah Atas (*Topbar*)**: Menampilkan status koneksi cloud secara langsung (**`Cloud Aktif (Real-Time)`** / **`Tersimpan di Cloud ✓`**) sehingga petugas Tata Usaha mengetahui bahwa arsip sudah tersimpan aman lintas perangkat.
